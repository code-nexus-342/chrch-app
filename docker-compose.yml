version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chrch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service (Node.js)
  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/chrch?sslmode=disable
      - CLIENT_URL=http://localhost:3000
      # Email settings (Replace with actual values in .env or override here if testing)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=test@example.com
      - SMTP_PASS=password
      - RECEIVING_EMAIL=admin@example.com
      - ADMIN_EMAIL=admin@example.com
    depends_on:
      - db
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Service (React/Vite)
  client:
    build: ./client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
